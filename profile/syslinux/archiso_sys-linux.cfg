LABEL lindows7-live
TEXT HELP
Boot Lindows7 Live on BIOS.
Try Lindows7 without installing to your system.
ENDTEXT
MENU LABEL Lindows7 Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%

LABEL lindows7-install
TEXT HELP
Boot Lindows7 Installer on BIOS.
Install Lindows7 to your system using Calamares installer.
ENDTEXT
MENU LABEL Lindows7 Install (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% desktop=calamares

# Accessibility boot option
LABEL lindows7-speech
TEXT HELP
Boot Lindows7 Live on BIOS with speakup screen reader.
Try Lindows7 without installing with speech feedback.
ENDTEXT
MENU LABEL Lindows7 Live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% accessibility=on
