---
# Calamares configuration file for Lindows7

# Modules configuration
modules-search: [ local ]

# Sequence of modules to run
sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - users
    - displaymanager
    - networkcfg
    - bootloader
    - plymouthcfg
    - initcpiocfg
    - removeuser
    - shellprocess
    - umount
  - show:
    - finished

# Branding configuration
branding: lindows7

# Prompt for installation
prompt-install: false

# Executable steps
exec-frontend: false