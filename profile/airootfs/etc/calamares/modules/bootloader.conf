---
# Bootloader module configuration for Lindows7

# EFI installation
efiBootLoader: "grub"
efiBootLoaderId: "Lindows7"
efiSystemPartition: "/boot/efi"

# GRUB configuration
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
grubFont: ""
grubTheme: ""

# BIOS installation
installEFISystemdBoot: false