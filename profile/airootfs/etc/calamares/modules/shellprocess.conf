---
# Strip live-session leftovers from the installed system.
dontChroot: false
timeout: 60
script:
  - "rm -f /etc/sddm.conf.d/autologin.conf"
  - "rm -f /etc/sudoers.d/liveuser /etc/polkit-1/rules.d/49-liveuser-calamares.rules"
  - "rm -f /etc/xdg/autostart/calamares-launch.desktop /etc/skel/Desktop/install-lindows7.desktop"
  - "rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
