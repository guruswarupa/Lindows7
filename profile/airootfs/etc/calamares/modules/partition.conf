---
# Partition module configuration for Lindows7

# EFI system partition
efi:
  mountPoint: "/boot/efi"
  recommendedSize: "512MiB"

# Swap choices offered during install. "small" scales with RAM (up to
# 8GiB, capped at 10% of disk) rather than using a fixed size.
userSwapChoices:
  - none    # No swap
  - small   # RAM-proportional swap, capped at 8GiB / 10% of disk
  - file    # Swap file instead of partition

# Pre-select "small" so the default/automatic install path sizes swap
# from RAM instead of requiring the user to pick a choice manually.
initialSwapChoice: small

# Default filesystem
defaultFileSystemType: "ext4"

# Partition table types
partitionTableType:
  - gpt

# Automated partitioning
autoPartitionEfi: true
autoPartitionSize: 100%

# Partition configuration
partitionLayout:
  - name: "Root"
    mountPoint: "/"
    size: "100%"
    filesystem: "ext4"