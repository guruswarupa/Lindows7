---
# Users module configuration for Lindows7

# Default user groups
defaultGroups:
  - lp
  - video
  - network
  - storage
  - wheel
  - audio
  - optical
  - floppy
  - uucp
  - scanner
  - games

# Do autologin
autologin: true

# Shell
setRootShell: true
userShell: /bin/bash

# Sudo configuration
sudoersConfigure: true
sudoersAdditions:
  - "%wheel ALL=(ALL) ALL"

# Password requirements
passwordRequirements:
  minlen: 0
  maxlen: -1
  noempty: false